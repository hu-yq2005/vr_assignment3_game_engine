<!doctype html>
<html>
<head>
    <meta name="description" content="My Cow Canvas">
    <title>My Cow</title>
</head>

<body>

    <div>
    <label for="fpsSlider">
        Rendering FPS: <span id="fpsValue">60</span>
    </label>

    <input
        type="range"
        id="fpsSlider"
        min="5"
        max="60"
        value="60"
        step="5"
    >
    </div>

    <canvas id="myCanvas"
            width="500"
            height="500"
            style="border: 1px solid black;">
    </canvas>

    <script src="script.js"></script>

</body>
</html>
